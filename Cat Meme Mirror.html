<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Meme Mirror</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background:#111; color:#eee; }
  header { padding:14px 18px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; border-bottom:1px solid #2a2a2a; }
  h1 { font-size:18px; margin:0; margin-right:auto; }
  button { background:#ffb347; color:#222; border:0; border-radius:8px; padding:9px 14px; font-weight:600; cursor:pointer; }
  button.secondary { background:#2b2b2b; color:#eee; }
  button:disabled { opacity:.5; cursor:default; }
  #status { font-size:13px; color:#aaa; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:14px; }
  @media (max-width:760px){ main { grid-template-columns:1fr; } }
  .panel { background:#1a1a1a; border-radius:12px; overflow:hidden; position:relative; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; }
  #cam, #overlay { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  #meme { width:100%; height:100%; object-fit:contain; display:none; background:#000; }
  #idle { color:#777; text-align:center; padding:20px; font-size:18px; }
  #label { position:absolute; left:10px; bottom:10px; background:#000a; padding:4px 10px; border-radius:20px; font-size:13px; }
  .legend { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; padding:0 14px 14px; }
  .item { background:#1a1a1a; border:2px solid transparent; border-radius:10px; padding:8px; font-size:12px; text-align:center; color:#bbb; }
  .item img { width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:6px; margin-bottom:6px; }
  .item.on { border-color:#ffb347; color:#fff; }
  .tune { padding:0 14px 20px; display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px 20px; font-size:13px; color:#bbb; }
  .tune label { display:flex; flex-direction:column; gap:4px; }
  #debug { font:12px/1.5 ui-monospace,Menlo,monospace; color:#8f8; padding:0 14px 20px; white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>Cat Meme Mirror</h1>
  <span id="status">Press Start, then allow the camera.</span>
  <button id="start">Start camera</button>
  <button id="calib" class="secondary" disabled>Calibrate neutral face</button>
</header>

<main>
  <div class="panel">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <div class="panel">
    <div id="idle">Make a gesture or expression!</div>
    <img id="meme" alt="meme">
    <div id="label"></div>
  </div>
</main>

<div class="legend" id="legend"></div>

<div class="tune">
  <label>Tongue sensitivity (lower = triggers easier)
    <input type="range" id="tongueThr" min="0.05" max="0.8" step="0.01" value="0.30"></label>
  <label>Sad / almost-crying sensitivity (lower = triggers easier)
    <input type="range" id="sadThr" min="0.05" max="0.8" step="0.01" value="0.30"></label>
  <label><span><input type="checkbox" id="showNums" checked> Show live numbers</span></label>
</div>
<div id="debug"></div>

const $ = id => document.getElementById(id);
const video = $("cam"), overlay = $("overlay"), ctx = overlay.getContext("2d");
const memeEl = $("meme"), idleEl = $("idle"), labelEl = $("label");

// legend
GESTURES.forEach(g => {
  const d = document.createElement("div");
  d.className = "item"; d.id = "item-" + g.id;
  d.innerHTML = `<img src="${g.img}" alt=""><div>${g.label}</div>`;
  $("legend").appendChild(d);
});

let hands, face, running = false, baseline = 0, calibrating = 0, calibSum = 0, calibN = 0;
let lastVideoTime = -1;

async function init() {
  $("status").textContent = "Loading AI models…";
  let fileset;
  try {
    fileset = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  } catch (e) { e.step = "loading the AI engine"; throw e; }
  const mk = async (step, Cls, url, extra) => {
    $("status").textContent = "Loading " + step + " model…";
    try {
      return await Cls.createFromOptions(fileset, {
        baseOptions:{ modelAssetPath:url, delegate:"CPU" }, runningMode:"VIDEO", ...extra });
    } catch (e) { e.step = "loading " + step + " model"; throw e; }
  };
  hands = await mk("hand", HandLandmarker,
    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
    { numHands:2 });
  face = await mk("face", FaceLandmarker,
    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
    { numFaces:1, outputFaceBlendshapes:true });
}

$("start").onclick = async () => {
  $("start").disabled = true;
  try {
    await init();
    $("status").textContent = "Asking for camera…";
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ width:640, height:480, facingMode:"user" }, audio:false });
    video.srcObject = stream;
    await video.play();
    overlay.width = video.videoWidth; overlay.height = video.videoHeight;
    running = true;
    $("calib").disabled = false;
    $("status").textContent = "Running. Try a gesture!";
    requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    const hint = e.name === "NotAllowedError" ? " Allow the camera in Chrome's address bar, then press Start again." : "";
    $("status").textContent = "Problem" + (e.step ? " while " + e.step : "") + ": " + (e.message || e) + "." + hint;
    $("start").disabled = false;
  }
};

$("calib").onclick = () => { calibrating = 45; calibSum = 0; calibN = 0; $("status").textContent = "Hold a relaxed neutral face…"; };

// ---------- geometry helpers ----------
const d3 = (a,b) => Math.hypot(a.x-b.x, a.y-b.y, a.z-b.z);
function ratio(w, tip, mcp) { return d3(w[tip], w[0]) / d3(w[mcp], w[0]); }
const EXT = 1.4, CURL = 1.25;
function fingers(w) {
  const r = { i:ratio(w,8,5), m:ratio(w,12,9), r:ratio(w,16,13), p:ratio(w,20,17) };
  return {
    r,
    idxE: r.i > EXT - 0.1,  // pointing at the camera is foreshortened, so be a bit lenient
    midE: r.m > EXT,
    idxC: r.i < CURL, midC: r.m < CURL, ringC: r.r < CURL, pinkC: r.p < CURL,
  };
}

function bs(res, name) {
  const cats = res?.faceBlendshapes?.[0]?.categories; if (!cats) return 0;
  const c = cats.find(c => c.categoryName === name); return c ? c.score : 0;
}

// ---------- gesture decision ----------
function decide(handRes, faceRes) {
  const W = video.videoWidth, H = video.videoHeight;
  const px = p => ({ x:p.x*W, y:p.y*H });
  const info = { fw:0, hands:handRes.landmarks.length, tongue:0, sad:0 };
  const fl = faceRes.faceLandmarks?.[0];
  let fw = 0, chin, mouth, nose, earL, earR, top;
  if (fl) {
    earL = px(fl[234]); earR = px(fl[454]); chin = px(fl[152]); mouth = px(fl[13]); nose = px(fl[1]); top = px(fl[10]);
    fw = Math.hypot(earL.x-earR.x, earL.y-earR.y);
    info.fw = Math.round(fw);
  }
  info.tongue = bs(faceRes, "tongueOut");
  const frown = (bs(faceRes,"mouthFrownLeft") + bs(faceRes,"mouthFrownRight")) / 2;
  const rawSad = 0.5*frown + 0.3*bs(faceRes,"browInnerUp") + 0.2*bs(faceRes,"mouthShrugLower");
  info.rawSad = rawSad;
  info.sad = Math.max(0, rawSad - baseline);

  const hs = handRes.landmarks.map((lm, i) => ({
    lm, w: handRes.worldLandmarks[i], f: fingers(handRes.worldLandmarks[i]),
    palm: px({ x:(lm[0].x+lm[5].x+lm[17].x)/3, y:(lm[0].y+lm[5].y+lm[17].y)/3 }),
    tip: px(lm[8]),
  }));
  info.fingers = hs.map(h => Object.entries(h.f.r).map(([k,v]) => k+":"+v.toFixed(2)).join(" "));

  // 1) both hands on ears
  if (fl && hs.length === 2) {
    const thr = 0.8*fw, yMin = top.y - 0.3*fw, yMax = chin.y + 0.2*fw;
    const inBand = h => h.palm.y > yMin && h.palm.y < yMax;
    const dd = (h,e) => Math.hypot(h.palm.x-e.x, h.palm.y-e.y);
    const a = dd(hs[0],earL) < thr && dd(hs[1],earR) < thr;
    const b = dd(hs[0],earR) < thr && dd(hs[1],earL) < thr;
    if ((a || b) && inBand(hs[0]) && inBand(hs[1])) return ["ears", info];
  }
  // 2) single-hand shapes
  for (const h of hs) {
    const f = h.f;
    if (f.midE && f.idxC && f.ringC && f.pinkC) return ["finger", info];
  }
  for (const h of hs) {
    const f = h.f;
    if (f.idxE && f.midC && f.ringC && f.pinkC) {
      if (fl) {
        const near = Math.min(Math.hypot(h.tip.x-chin.x, h.tip.y-chin.y), Math.hypot(h.tip.x-mouth.x, h.tip.y-mouth.y));
        info.chinDist = (near/fw).toFixed(2);
        if (near < 0.55*fw && h.tip.y > nose.y) return ["chin", info];
      }
      return ["point", info];
    }
  }
  // 3) face expressions
  if (info.tongue > parseFloat($("tongueThr").value)) return ["tongue", info];
  if (info.sad > parseFloat($("sadThr").value)) return ["sad", info];
  return [null, info];
}

// ---------- main loop with debounce ----------
let current = null, cand = null, candCount = 0, frameNo = 0, lastFr = null;
function show(id) {
  current = id;
  GESTURES.forEach(g => $("item-"+g.id).classList.toggle("on", g.id === id));
  if (id) {
    memeEl.src = byId[id].img; memeEl.style.display = "block"; idleEl.style.display = "none";
    labelEl.textContent = byId[id].label;
  } else {
    memeEl.style.display = "none"; idleEl.style.display = "block"; labelEl.textContent = "";
  }
}

function drawHands(res) {
  ctx.clearRect(0,0,overlay.width,overlay.height);
  ctx.fillStyle = "#ffb347";
  for (const lm of res.landmarks) for (const p of lm) {
    ctx.beginPath(); ctx.arc(p.x*overlay.width, p.y*overlay.height, 3, 0, 6.3); ctx.fill();
  }
}

function loop() {
  if (!running) return;
  if (video.currentTime !== lastVideoTime && video.readyState >= 2) {
    lastVideoTime = video.currentTime;
    const t = performance.now();
    frameNo++;
    const hr = hands.detectForVideo(video, t);
    if (!lastFr || frameNo % 2 === 0) lastFr = face.detectForVideo(video, t + 0.01);
    const fr = lastFr;
    drawHands(hr);
    const [g, info] = decide(hr, fr);

    if (calibrating > 0) {
      calibSum += info.rawSad; calibN++; calibrating--;
      if (calibrating === 0) { baseline = calibSum / Math.max(1,calibN); $("status").textContent = "Calibrated. Running."; }
    }

    if (g === cand) candCount++; else { cand = g; candCount = 1; }
    const need = g === null ? 8 : 3;       // quick to show, slower to hide
    if (cand !== current && candCount >= need) show(cand);

    if ($("showNums").checked) {
      $("debug").textContent =
        `detected: ${g || "-"}   showing: ${current || "-"}\n` +
        `hands: ${info.hands}  face width px: ${info.fw}\n` +
        `tongueOut: ${info.tongue.toFixed(2)}   sad score: ${info.sad.toFixed(2)} (raw ${info.rawSad.toFixed(2)}, baseline ${baseline.toFixed(2)})\n` +
        (info.chinDist ? `index tip to chin / face width: ${info.chinDist}\n` : "") +
        info.fingers.map((s,i)=>`hand ${i+1} finger ratios  ${s}`).join("\n");
    } else $("debug").textContent = "";
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
